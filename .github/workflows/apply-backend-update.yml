name: Apply NeuroPass backend-connected frontend

on:
  push:
    branches: [main]
    paths:
      - '.backend-update/**'
      - '.github/workflows/apply-backend-update.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild and validate patch
        run: |
          cat .backend-update/part-*.patch > /tmp/backend.patch
          git apply --check /tmp/backend.patch
          git apply /tmp/backend.patch

      - name: Commit backend-connected frontend
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html storage.js sw.js supabase-client.js
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Connect NeuroPass frontend to Supabase"
          git push
